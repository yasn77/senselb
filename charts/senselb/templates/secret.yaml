{{- if .Values.provider.secret.create }}
# Documentation placeholder only.
#
# NEVER commit a real credential here or in any values file. Create the Secret
# through your GitOps secret manager and leave provider.secret.create false, or
# name an out-of-band Secret in provider.secret.existingSecret. The keys below
# are empty on purpose, so the controller refuses to start until they are
# replaced outside this chart.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "senselb.providerSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "senselb.labels" . | nindent 4 }}
type: Opaque
stringData:
  key: {{ .Values.provider.secret.key | quote }}
  secret: {{ .Values.provider.secret.secret | quote }}
  url: {{ .Values.provider.secret.url | quote }}
{{- end }}
