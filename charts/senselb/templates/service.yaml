{{- if .Values.metrics.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "senselb.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "senselb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metrics.service.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "senselb.selectorLabels" . | nindent 4 }}
{{- end }}
