# Reference provider credential for senselb.
#
# THIS FILE CONTAINS NO CREDENTIAL AND MUST NEVER CONTAIN ONE.
#
# The chart does not create a usable Secret. Create senselb-opnsense through
# your GitOps secret manager (External Secrets, Sealed Secrets, or an OpenBao
# injection path) and commit only the reference to it -- never the values.
# ADR 0005 fixes the key names and the URL precedence.
#
# The controller reads this Secret once at startup, from its own namespace
# (--config-namespace, senselb-system by default). Both "key" and "secret" must
# be non-empty or the controller refuses to start; "url" is optional.
#
# In OPNsense, create a dedicated user and an API key pair for it under
# System → Access → Users (edit the user, then API keys). Grant only the
# HAProxy privileges senselb needs: an OPNsense API key inherits the user's
# privileges, so a dedicated least-privilege user is the control, not a
# per-key scope. Never reuse a full-administrator key.
apiVersion: v1
kind: Secret
metadata:
  name: senselb-opnsense
  namespace: senselb-system
type: Opaque
# stringData is used for readability. The base64-encoded equivalent of every
# value below is the empty string; the placeholders are deliberately empty so
# an accidental apply cannot authenticate anywhere.
stringData:
  # The OPNsense API key. Fill from your secret manager; do not commit.
  key: ""
  # The OPNsense API secret. Fill from your secret manager; do not commit.
  secret: ""
  # Optional. A non-empty url here overrides provider.url in the ConfigMap,
  # which lets one deployment point at a different firewall without editing
  # the chart values. Leave empty to use provider.url.
  #
  # It must be the full API base URL, including /api/haproxy, for example:
  #   url: "https://172.16.16.1:2443/api/haproxy"
  url: ""
