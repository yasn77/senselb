# Pinned toolchain for senselb.
# Resolve new versions with `mise latest <tool>`, then pin the resolved value here.

[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
goreleaser = "2.19.0"
helm = "4.3.1"

[tasks.build]
description = "Compile every package in the module."
run = "go build ./..."

[tasks.test]
description = "Run the full test suite."
run = "go test ./..."

[tasks.vet]
description = "Run the Go vet static analyser."
run = "go vet ./..."

[tasks.lint]
description = "Run golangci-lint over the module."
run = "golangci-lint run ./..."

[tasks.docker-build]
description = "Snapshot release: binaries, archives, checksums and the chart, plus the container image when a Docker daemon is reachable."
run = """
if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
  goreleaser release --snapshot --clean
else
  echo "Docker is unavailable: building the snapshot without the container image."
  goreleaser release --snapshot --clean --skip=docker
fi
"""

[tasks.helm-lint]
description = "Lint the Helm chart in strict mode."
run = "helm lint --strict charts/senselb"
